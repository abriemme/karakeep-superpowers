name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv stopped publishing moving major tags after v7, so pin the
        # release commit (their recommended style).
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies (from uv.lock)
        run: uv sync --frozen

      # Hook environments (ruff, uv, the action-validator binary) are keyed on
      # the config, so a rev bump rebuilds them and nothing else does.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs the same hooks as the local commit gate, at the same pinned revs:
      # ruff check + format, uv.lock freshness, YAML/TOML syntax, workflow
      # schema. Autofixing hooks fail the job and print the diff they'd apply.
      - name: Pre-commit (ruff, uv-lock, YAML/TOML, workflows)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests + replay
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies (from uv.lock)
        run: uv sync --frozen

      # Unit tests (time-skipping) + replay test on the histories committed in
      # tests/histories/. Replay downloads the bundled Temporal test server;
      # nothing else to provision. Coverage (with a fail-under threshold) is
      # wired via addopts in pyproject.toml, so `pytest` enforces it here.
      - name: Run tests (unit + replay, with coverage)
        env:
          GIT_SHA: ${{ github.sha }}
        run: uv run pytest -v

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  docker:
    name: Build & push image (tag = SHA)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image tagged with the git SHA
        uses: docker/build-push-action@v7
        with:
          context: .
          # Only push on the default branch; otherwise build only.
          push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
