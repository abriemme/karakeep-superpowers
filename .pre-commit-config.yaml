# Local commit gate: run `uv run pre-commit install` once, then every commit is
# blocked unless these hooks pass. The ruff hooks mirror the CI lint job
# (.github/workflows/ci.yml); uv-lock keeps uv.lock in sync with pyproject.toml,
# which CI installs with `uv sync --frozen`.
#
# Recorded Temporal histories are byte-exact replay fixtures regenerated by
# scripts/generate_history.py -- never reformatted in place.
exclude: ^tests/histories/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Keeps uv.lock in sync with pyproject.toml (CI installs with --frozen).
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # Lint, auto-fixing what ruff can fix safely.
      - id: ruff-check
        args: [--fix]
      # Format.
      - id: ruff-format

  # Schema-validates the GitHub Actions workflows in .github/workflows/.
  - repo: https://github.com/mpalmer/action-validator
    rev: v0.9.0
    hooks:
      - id: action-validator
