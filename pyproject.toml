[project]
name = "ig-to-karakeep"
version = "0.1.0"
description = "Sync Instagram saved posts to Karakeep via Temporal, with pydantic-ai LLM enrichment (Worker Deployment Versioning, time-skipping and replay tests)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "karakeep-python-api>=1.9.0",
    "logfire[system-metrics]>=4.41.0",
    "pydantic-ai[temporal]>=2.37.0",
    "pydantic-ai-slim[openai]>=2.37.0",
    "python-dotenv>=1.2.3",
    "requests>=2.32",
    "temporalio>=1.32.0",
    "karakeep-python-api>=1.9.0",
]

# Instagram private-API client + TOTP, only needed on the machine that runs
# the sync activities (worker): `uv sync --group ig`.
[dependency-groups]
ig = [
    "instagrapi>=2.1",
    "pyotp>=2.9",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Lazy re-export packages: TYPE_CHECKING imports + runtime __getattr__.
"app/sync/__init__.py" = ["F401"]
"app/youtube/__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
testpaths = ["tests"]
# Coverage runs on every `pytest` invocation (local and CI) so the threshold
# below gates the same way everywhere.
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    # karakeep-python-api's own type hints trip beartype's PEP 585
    # deprecation warnings at import; third-party noise, not ours to fix.
    "ignore:::karakeep_python_api",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
# Floor for the whole package. Domain logic (config, activities, karakeep,
# models, state) is at 100%; the remaining gap is process bootstrap
# (worker.py / starter.py) exercised end-to-end rather than in unit tests.
fail_under = 75

[tool.setuptools]
packages = ["app"]
